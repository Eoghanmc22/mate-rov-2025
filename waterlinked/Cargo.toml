[package]
name = "waterlinked"
version = "0.1.0"
edition = "2021"


[dependencies]
common = { workspace = true }
networking = { workspace = true }
motor_math = { workspace = true }

bevy = { workspace = true, default-features = true, features = [
  "wayland",
  "dynamic_linking",
] }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }

anyhow = { workspace = true }

reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
bevy-tokio-tasks = { workspace = true }

egui = { workspace = true }
egui_plot = { workspace = true }
bevy_egui = { workspace = true }
bevy-inspector-egui = { workspace = true }
minikalman = { version = "0.6", features = ["std"] }
nalgebra = { version = "0.33", features = ["convert-glam027"] }
adskalman = "0.16"
rand_distr = { version = "0.5" }

[dev-dependencies]
rand = "0.9"
